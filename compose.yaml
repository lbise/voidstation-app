name: voidstation-app

x-voidstation:
  expected_data_filesystem_uuid: "${VOIDSTATION_DATA_FILESYSTEM_UUID:?Set VOIDSTATION_DATA_FILESYSTEM_UUID in .env}"

services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${VOIDSTATION_LAN_BIND_ADDRESS:?Set VOIDSTATION_LAN_BIND_ADDRESS in .env}:${VOIDSTATION_LAN_PORT:?Set VOIDSTATION_LAN_PORT in .env}:3000"
      - "${VOIDSTATION_TAILSCALE_BIND_ADDRESS:?Set VOIDSTATION_TAILSCALE_BIND_ADDRESS in .env}:${VOIDSTATION_TAILSCALE_PORT:?Set VOIDSTATION_TAILSCALE_PORT in .env}:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    # Bind one dedicated directory on each selected host filesystem. Do not
    # replace these with / or a broad host mount.
    volumes:
      - type: bind
        source: /proc/stat
        target: /host/proc/stat
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/uptime
        target: /host/proc/uptime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/meminfo
        target: /host/proc/meminfo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_ROOT_FILESYSTEM_PATH:?Set VOIDSTATION_ROOT_FILESYSTEM_PATH in .env}"
        target: /host/filesystems/root
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_DATA_FILESYSTEM_PATH:?Set VOIDSTATION_DATA_FILESYSTEM_PATH in .env}"
        target: /host/filesystems/data
        read_only: true
        bind:
          create_host_path: false
