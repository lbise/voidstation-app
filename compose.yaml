name: voidstation-app

x-voidstation:
  expected_data_filesystem_uuid: "${VOIDSTATION_DATA_FILESYSTEM_UUID:?Set VOIDSTATION_DATA_FILESYSTEM_UUID in .env}"
  # Host ingress policy metadata. The ingress service reads the same values from
  # /etc/voidstation/ingress.json; it does not infer trusted LANs from Docker.
  lan_interface: "${VOIDSTATION_LAN_INTERFACE:?Set VOIDSTATION_LAN_INTERFACE in .env}"
  lan_source: "${VOIDSTATION_LAN_SOURCE:?Set VOIDSTATION_LAN_SOURCE in .env}"
  lan_bind_address: "${VOIDSTATION_LAN_BIND_ADDRESS:?Set VOIDSTATION_LAN_BIND_ADDRESS in .env}"
  lan_https_port: "${VOIDSTATION_LAN_HTTPS_PORT:?Set VOIDSTATION_LAN_HTTPS_PORT in .env}"
  lan_tls_directory: "${VOIDSTATION_LAN_TLS_DIRECTORY:?Set VOIDSTATION_LAN_TLS_DIRECTORY in .env}"

networks:
  default:
    name: voidstation-app_default
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-voidstation

services:
  dashboard:
    build: .
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${VOIDSTATION_TAILSCALE_BIND_ADDRESS:?Set VOIDSTATION_TAILSCALE_BIND_ADDRESS in .env}:${VOIDSTATION_PORT:?Set VOIDSTATION_PORT in .env}:3000"
      - "${VOIDSTATION_LAN_BIND_ADDRESS:?Set VOIDSTATION_LAN_BIND_ADDRESS in .env}:${VOIDSTATION_LAN_HTTPS_PORT:?Set VOIDSTATION_LAN_HTTPS_PORT in .env}:3443"
    environment:
      # Docker needs a container-wide listener. The host publication remains the
      # configured Tailscale CGNAT address, never a wildcard or LAN address.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      VOIDSTATION_ORIGIN: "${VOIDSTATION_ORIGIN:?Set VOIDSTATION_ORIGIN in .env}"
      VOIDSTATION_LAN_ORIGIN: "${VOIDSTATION_LAN_ORIGIN:?Set VOIDSTATION_LAN_ORIGIN in .env}"
      VOIDSTATION_LAN_PORT: "3443"
      VOIDSTATION_LAN_TLS_CERT: "/run/voidstation-lan-tls/cert.pem"
      VOIDSTATION_LAN_TLS_KEY: "/run/voidstation-lan-tls/key.pem"
      VOIDSTATION_TLS_CERT: "/run/voidstation-tls/cert.pem"
      VOIDSTATION_TLS_KEY: "/run/voidstation-tls/key.pem"
      VOIDSTATION_AUTH_DB: "/var/lib/voidstation/auth.sqlite"
      VOIDSTATION_HOST_PROC: "/host/proc"
      VOIDSTATION_HOST_ROOT_FS: "/host/filesystems/root"
      VOIDSTATION_HOST_DATA_FS: "/host/filesystems/data"
      VOIDSTATION_WORKER_URL: "http://assistant-worker:3001"
      VOIDSTATION_WORKER_TOKEN_FILE: "/run/voidstation-worker/token"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      # Keep these five narrow metrics inputs read-only. Do not replace them
      # with / or a broad host mount.
      - type: bind
        source: /proc/stat
        target: /host/proc/stat
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/uptime
        target: /host/proc/uptime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/meminfo
        target: /host/proc/meminfo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_ROOT_FILESYSTEM_PATH:?Set VOIDSTATION_ROOT_FILESYSTEM_PATH in .env}"
        target: /host/filesystems/root
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_DATA_FILESYSTEM_PATH:?Set VOIDSTATION_DATA_FILESYSTEM_PATH in .env}"
        target: /host/filesystems/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_AUTH_DIRECTORY:?Set VOIDSTATION_AUTH_DIRECTORY in .env}"
        target: /var/lib/voidstation
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_TLS_DIRECTORY:?Set VOIDSTATION_TLS_DIRECTORY in .env}"
        target: /run/voidstation-tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_LAN_TLS_DIRECTORY:?Set VOIDSTATION_LAN_TLS_DIRECTORY in .env}"
        target: /run/voidstation-lan-tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_WORKER_TOKEN_FILE:?Set VOIDSTATION_WORKER_TOKEN_FILE in .env}"
        target: /run/voidstation-worker/token
        read_only: true
        bind:
          create_host_path: false

  assistant-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      VOIDSTATION_WORKER_HOST: "0.0.0.0"
      VOIDSTATION_WORKER_PORT: "3001"
      VOIDSTATION_WORKER_TOKEN_FILE: "/run/voidstation-worker/token"
      VOIDSTATION_CONVERSATION_DIR: "/var/lib/voidstation/conversations"
      VOIDSTATION_CREDENTIAL_DIR: "/var/lib/voidstation/credentials"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - type: bind
        source: "${VOIDSTATION_WORKER_TOKEN_FILE:?Set VOIDSTATION_WORKER_TOKEN_FILE in .env}"
        target: /run/voidstation-worker/token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_CONVERSATION_DIRECTORY:?Set VOIDSTATION_CONVERSATION_DIRECTORY in .env}"
        target: /var/lib/voidstation/conversations
        bind:
          create_host_path: false
      - type: bind
        source: "${VOIDSTATION_CREDENTIAL_DIRECTORY:?Set VOIDSTATION_CREDENTIAL_DIRECTORY in .env}"
        target: /var/lib/voidstation/credentials
        bind:
          create_host_path: false
