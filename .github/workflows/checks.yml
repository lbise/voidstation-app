name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      - run: node scripts/compose-runtime-check.mjs
      - run: npm run typecheck
      - run: npm run typecheck --prefix worker
      - run: npm run build --prefix worker
      - run: docker build --target build --tag voidstation-assistant-worker:test worker
      - run: docker build --target runtime --tag voidstation-assistant-worker:check worker
      - run: node scripts/worker-runtime-inspect.mjs voidstation-assistant-worker:check voidstation-assistant-worker:test
      - run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: "1"
